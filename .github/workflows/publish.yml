name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Notify Packagist to crawl the repo after a tag push. Packagist reads
# versions from Git tags; no artifact upload. The token is mandatory.
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Require Packagist credentials
        run: |
          if [ -z "${PACKAGIST_TOKEN:-}" ]; then
            echo "::error::PACKAGIST_TOKEN is required for a release tag"
            exit 1
          fi
      - name: Update Packagist
        env:
          PACKAGIST_USERNAME: authio
          PACKAGIST_REPO_URL: https://github.com/authio-com/authio_php
        run: |
          curl -fsS -X POST \
            -H 'content-type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"${PACKAGIST_REPO_URL}\"}}"
